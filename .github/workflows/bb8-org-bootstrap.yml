name: BB8 organization bootstrap
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Optional Kikiland-ai/repo; blank scans newly created repos'
        required: false
        type: string
      dry_run:
        description: 'Inspect the bootstrap plan without writing target repos'
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: bb8-organization-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'Kikiland-ai/Design-Thinking' && vars.BB8_BOOTSTRAP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate the source before accessing organization repositories
        run: |
          python bb8/adapters/reference/bb8.py validate
          python bb8/adapters/discovery/sync.py --check
          python -B -m unittest discover -s bb8/tests -p 'test_*.py' -v
      - name: Use the administrator-configured organization installation
        id: identity
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.BB8_APP_CLIENT_ID }}
          private-key: ${{ secrets.BB8_APP_PRIVATE_KEY }}
          owner: Kikiland-ai
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Bootstrap explicitly configured organization repositories
        env:
          BB8_GITHUB_TOKEN: ${{ steps.identity.outputs.token }}
          BB8_SOURCE_REVISION: ${{ github.sha }}
          BB8_TARGET_REPOSITORY: ${{ inputs.repository }}
          BB8_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python - <<'PY'
          import os, subprocess
          command = ['python', 'bb8/provisioning/bootstrap.py']
          target = os.environ.get('BB8_TARGET_REPOSITORY', '')
          command += ['bootstrap', '--repository', target] if target else ['scan']
          command += ['--source-revision', os.environ['BB8_SOURCE_REVISION']]
          if os.environ.get('BB8_DRY_RUN', '').lower() == 'true':
              command += ['--dry-run']
          subprocess.run(command, check=True)
          PY
