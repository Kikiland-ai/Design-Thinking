<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style>
<title>Mid-sem Onboarding Demo</title>
<style>@import url("https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Baloo+Bhaina+2:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600&family=Roboto+Mono:wght@400;500&family=Kalam:wght@400&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=swap");

/* Breadboard component styles. Every colour comes from tokens.json; fallbacks are the light values. */

.bb-root, .bb-root * { box-sizing: border-box; }
body { font-family: var(--font-body, "Noto Sans", system-ui, sans-serif); color: var(--ink, #1f1f1f); background: var(--paper, #fbfaf7); }
.bb-grid-bg {
  background-color: var(--paper, #fbfaf7);
  background-image: radial-gradient(var(--grid-dot, #e3e1dc) 1.2px, transparent 1.3px);
  background-size: 8px 8px;
}
.bb-or { font-family: var(--font-odia, "Noto Sans Oriya", "Noto Sans", sans-serif); font-size: 1.12em; line-height: 1.66; }
.bb-mono { font-family: var(--font-mono, "Roboto Mono", ui-monospace, monospace); font-variant-numeric: tabular-nums; }
.bb-label { font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.02em; }
.bb-icon { font-family: "Material Symbols Rounded"; font-weight: 500; font-style: normal; font-size: 20px; line-height: 1; display: inline-block; vertical-align: -4px; font-variation-settings: "FILL" 0, "wght" 500, "opsz" 24; -webkit-font-feature-settings: "liga"; font-feature-settings: "liga"; }
.bb-icon.bb-filled { font-variation-settings: "FILL" 1, "wght" 500, "opsz" 24; }
.bb-focus:focus-visible, .bb-btn:focus-visible, .bb-term:focus-visible, .bb-dial-knob:focus-visible, .bb-sticker:focus-visible, .bb-snap-mark:focus-visible, .bb-source:focus-visible {
  outline: 2px solid var(--focus-ring, #1967d2); outline-offset: 2px;
}
.bb-visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Button: a tactile key */
.bb-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2, 8px);
  min-height: 48px; padding: 0 22px; border-radius: var(--radius-pill, 999px); border: 0; cursor: pointer;
  font: 600 16px/1 var(--font-body, "Noto Sans", system-ui, sans-serif);
  transition: transform 120ms ease, box-shadow 120ms ease, background-color 120ms ease;
}
.bb-btn:active { transform: translateY(2px); }
.bb-btn-filled { background: var(--blue-ink, #1967d2); color: var(--on-blue-ink, #ffffff); box-shadow: var(--key-edge-blue, 0 3px 0 #0f4fa8); }
.bb-btn-filled:active { box-shadow: 0 1px 0 #0f4fa8; }
.bb-btn-tonal { background: var(--paper-raised, #ffffff); color: var(--ink, #1f1f1f); border: 1px solid var(--line, #d9d6cf); box-shadow: var(--key-edge-neutral, 0 3px 0 #c9c5bc); }
.bb-btn-tonal:active { box-shadow: 0 1px 0 #c9c5bc; }
.bb-btn-text { background: transparent; color: var(--blue-ink, #1967d2); padding: 0 12px; min-height: 40px; }
.bb-btn-text:active { transform: none; background: var(--blue-tint, #e8f0fe); }
.bb-btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }

/* Kiki */
.bb-kiki { display: inline-block; overflow: visible; }
.bb-kiki-dot-g { transition: transform 360ms cubic-bezier(.34,1.56,.64,1); }
.bb-kiki-dot { transform-box: fill-box; transform-origin: center; }
.bb-kiki-idle .bb-kiki-dot { animation: bb-breathe 2.4s ease-in-out infinite; }
.bb-kiki-listening .bb-kiki-dot { animation: bb-eq 0.9s ease-in-out infinite; }
.bb-kiki-thinking .bb-kiki-dot { animation: bb-wave 1s ease-in-out infinite; }
.bb-kiki-speaking .bb-kiki-dot { animation: bb-pulse 0.7s ease-in-out infinite; }
.bb-kiki-pointing .bb-kiki-dot { animation: bb-nudge 1.1s ease-in-out infinite; }
.bb-kiki-asking .bb-kiki-dot { animation: bb-breathe 1.6s ease-in-out infinite; }
.bb-kiki-celebrating .bb-kiki-dot { animation: bb-pop 0.9s cubic-bezier(.34,1.56,.64,1) infinite alternate; }
.bb-kiki-unsure .bb-kiki-dot { animation: bb-wobble 2.6s ease-in-out infinite; }
.bb-kiki-examiner .bb-kiki-dot { animation: none; }
@keyframes bb-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(0.86); } }
@keyframes bb-eq { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(2.3); } }
@keyframes bb-wave { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes bb-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.22); } }
@keyframes bb-nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
@keyframes bb-pop { from { transform: scale(0.8); } to { transform: scale(1.25); } }
@keyframes bb-wobble { 0%,100% { transform: translate(0,0); } 33% { transform: translate(2px,-2px); } 66% { transform: translate(-2px,1px); } }

/* Mastery ring */
.bb-ring { position: relative; display: inline-grid; place-items: center; }
.bb-ring svg { display: block; transform: rotate(-90deg); overflow: visible; }
.bb-ring-track { fill: none; stroke: var(--line, #d9d6cf); }
.bb-ring-fill { fill: none; transition: stroke-dasharray 700ms cubic-bezier(.2,.8,.2,1); }
.bb-ring-locked { fill: none; stroke: var(--pencil, #5f6368); opacity: 0.5; }
.bb-ring-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.bb-ring-flicker svg { animation: bb-flicker 2.2s ease-in-out infinite; }
.bb-ring-complete svg { animation: bb-spin-once 900ms cubic-bezier(.2,.8,.2,1) 1; filter: drop-shadow(0 0 6px rgba(66,133,244,0.35)); }
@keyframes bb-flicker { 0%,100% { opacity: 1; } 40% { opacity: 0.35; } 55% { opacity: 0.8; } 70% { opacity: 0.4; } }
@keyframes bb-spin-once { from { transform: rotate(-450deg); } to { transform: rotate(-90deg); } }

/* Language dial */
.bb-dial { display: grid; gap: var(--space-2, 8px); width: 100%; max-width: 420px; user-select: none; touch-action: none; }
.bb-dial-ends { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 600; color: var(--pencil, #5f6368); }
.bb-dial-ends .bb-or { font-size: 15px; line-height: 1; }
.bb-dial-track { position: relative; height: 44px; cursor: pointer; }
.bb-dial-rail { position: absolute; left: 18px; right: 18px; top: 20px; height: 4px; border-radius: 4px; background: var(--line, #d9d6cf); }
.bb-dial-notch { position: absolute; top: 15px; width: 2px; height: 14px; margin-left: -1px; background: var(--pencil, #5f6368); border-radius: 2px; }
.bb-dial-knob {
  position: absolute; top: 4px; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%;
  background: var(--paper-raised, #ffffff); border: 2px solid var(--ink, #1f1f1f); box-shadow: var(--key-edge-neutral, 0 3px 0 #c9c5bc);
  transition: left 220ms cubic-bezier(.34,1.56,.64,1); cursor: grab;
}
.bb-dial-knob::after { content: ""; position: absolute; left: 50%; top: 5px; width: 3px; height: 11px; margin-left: -1.5px; border-radius: 2px; background: var(--blue-ink, #1967d2); transform-origin: 50% 13px; transform: rotate(var(--bb-knob-angle, 0deg)); transition: transform 220ms ease; }
.bb-dial-ghost { position: absolute; top: 4px; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; border: 2px dashed var(--blue-ink, #1967d2); background: var(--blue-tint, #e8f0fe); opacity: 0.85; pointer-events: none; animation: bb-breathe 1.8s ease-in-out infinite; }
.bb-dial-caption { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2, 8px); min-height: 32px; font-size: 13px; color: var(--pencil, #5f6368); }
.bb-dial-try { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--blue-ink, #1967d2); background: var(--blue-tint, #e8f0fe); color: var(--blue-ink, #1967d2); font: 600 13px/1 var(--font-body, "Noto Sans", sans-serif); cursor: pointer; }

/* Term chip and its sheet */
.bb-term-wrap { position: relative; display: inline; }
.bb-term {
  display: inline; padding: 1px 6px; margin: 0 1px; border-radius: 8px; border: 0; cursor: pointer;
  font: 600 0.94em/1.4 var(--font-body, "Noto Sans", sans-serif); color: var(--ink, #1f1f1f);
  background: transparent; text-decoration: underline dotted var(--blue-ink, #1967d2); text-decoration-thickness: 2px; text-underline-offset: 4px;
  transition: background-color 160ms ease;
}
.bb-term:hover { background: var(--blue-tint, #e8f0fe); }
.bb-term-collected { background: var(--red-tint, #fce8e6); text-decoration-color: var(--red-ink, #c5221f); }
.bb-term-owned { background: var(--red-strong, #c5221f); color: #ffffff; text-decoration: none; }
.bb-term-pulse { animation: bb-term-pulse 700ms ease 1; }
@keyframes bb-term-pulse { 0% { box-shadow: 0 0 0 0 rgba(66,133,244,0.55); } 100% { box-shadow: 0 0 0 8px rgba(66,133,244,0); } }
.bb-sheet {
  position: absolute; z-index: 20; left: 0; top: calc(100% + 8px); width: min(300px, 86vw);
  padding: var(--space-4, 16px); border-radius: 20px; background: var(--paper-raised, #ffffff); color: var(--ink, #1f1f1f);
  border: 1px solid var(--line, #d9d6cf); box-shadow: var(--lift, 0 8px 24px rgba(31,31,31,0.12));
  display: grid; gap: var(--space-2, 8px); text-align: left; font-weight: 400; line-height: 1.45; white-space: normal;
}
.bb-sheet-term { font: 700 22px/1.1 var(--font-display, "Baloo 2", sans-serif); }
.bb-sheet-example { font-size: 14px; color: var(--pencil, #5f6368); }
.bb-sheet-row { display: flex; gap: var(--space-2, 8px); align-items: center; flex-wrap: wrap; }

/* Morph text */
.bb-morph { font-size: 16px; line-height: 1.85; max-width: 62ch; }
.bb-morph-anim { animation: bb-morph 380ms ease both; }
@keyframes bb-morph { from { opacity: 0; filter: blur(3px); transform: translateY(3px); } to { opacity: 1; filter: none; transform: none; } }

/* Word sticker */
.bb-sticker { position: relative; width: 168px; height: 200px; perspective: 900px; cursor: pointer; border: 0; padding: 0; background: none; font: inherit; color: inherit; }
.bb-sticker-inner { position: absolute; inset: 0; transition: transform 520ms cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.bb-sticker-flipped .bb-sticker-inner { transform: rotateY(180deg); }
.bb-sticker-face {
  position: absolute; inset: 0; border-radius: var(--radius-card, 24px); backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: grid; align-content: space-between; padding: var(--space-4, 16px); text-align: left;
  background: var(--paper-raised, #ffffff); border: 2px solid var(--red, #ea4335); box-shadow: var(--key-edge-neutral, 0 3px 0 #c9c5bc);
}
.bb-sticker-back { transform: rotateY(180deg); background: var(--red-tint, #fce8e6); }
.bb-sticker-new .bb-sticker-front { border-style: dashed; }
.bb-sticker-owned .bb-sticker-front { background: var(--red-strong, #c5221f); border-color: var(--red-strong, #c5221f); color: #ffffff; }
.bb-sticker-term { font: 700 22px/1.1 var(--font-display, "Baloo 2", sans-serif); }
.bb-sticker-state { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }

/* Lesson progress */
.bb-progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; }
.bb-progress-seg { height: 8px; border-radius: 8px; background: var(--line, #d9d6cf); overflow: hidden; }
.bb-progress-fill { height: 100%; border-radius: 8px; transition: width 600ms cubic-bezier(.2,.8,.2,1); }

/* Explorable */
.bb-explore { display: grid; gap: var(--space-3, 12px); padding: var(--space-4, 16px); border-radius: var(--radius-card, 24px); background: var(--paper-raised, #ffffff); border: 1px solid var(--line, #d9d6cf); max-width: 560px; }
.bb-explore-figs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: var(--space-3, 12px); align-items: center; }
.bb-explore svg { width: 100%; height: auto; display: block; }
.bb-explore input[type="range"] { width: 100%; accent-color: var(--blue-ink, #1967d2); }
.bb-explore-read { display: flex; justify-content: space-between; gap: var(--space-2, 8px); flex-wrap: wrap; font-size: 14px; }
.bb-explore-kiki { display: flex; gap: var(--space-2, 8px); align-items: center; font-size: 14px; min-height: 40px; }
.bb-current { stroke-dasharray: 2 10; stroke-linecap: round; animation: bb-flow linear infinite; }
@keyframes bb-flow { to { stroke-dashoffset: -24; } }

/* Diagnosis card */
.bb-diag { display: grid; gap: var(--space-3, 12px); padding: var(--space-4, 16px); border-radius: var(--radius-card, 24px); background: var(--paper-raised, #ffffff); border: 1px solid var(--line, #d9d6cf); max-width: 420px; }
.bb-diag-pills { display: flex; gap: var(--space-2, 8px); flex-wrap: wrap; }
.bb-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1.5px solid transparent; }
.bb-pill-concept-yes { background: var(--green-tint, #e6f4ea); color: var(--green-ink, #137333); border-color: var(--green, #34a853); }
.bb-pill-english-yes { background: var(--yellow-tint, #fef7e0); color: var(--yellow-ink, #9a5500); border-color: var(--yellow, #fbbc05); }
.bb-pill-notyet { background: transparent; color: var(--pencil, #5f6368); border: 1.5px dashed var(--pencil, #5f6368); }
.bb-diag-title { font: 700 20px/1.2 var(--font-display, "Baloo 2", sans-serif); }
.bb-diag-msg { font-size: 15px; line-height: 1.5; }

/* Voice scope */
.bb-scope { display: grid; gap: var(--space-3, 12px); max-width: 420px; }
.bb-scope-screen { position: relative; border-radius: 18px; background: var(--scope-glass, #0e1116); overflow: hidden; aspect-ratio: 16 / 7; }
.bb-scope-screen canvas { width: 100%; height: 100%; display: block; }
.bb-scope-tag { position: absolute; left: 12px; top: 10px; font: 500 12px/1 var(--font-mono, "Roboto Mono", monospace); color: var(--scope-text, #c9d6df); }
.bb-scope-row { display: flex; gap: var(--space-3, 12px); align-items: center; }
.bb-mic {
  width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
  background: var(--yellow, #fbbc05); color: var(--on-yellow, #1f1f1f); box-shadow: 0 3px 0 #b07f00; display: grid; place-items: center;
}
.bb-mic .bb-icon { font-size: 30px; }
.bb-mic-rec { animation: bb-pulse 0.9s ease-in-out infinite; }
.bb-scope-transcript { font-size: 15px; line-height: 1.6; }
.bb-scope-fix { font-size: 14px; padding: 10px 12px; border-radius: 14px; background: var(--yellow-tint, #fef7e0); color: var(--ink, #1f1f1f); }

/* Receipt compare */
.bb-receipt { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-3, 12px); max-width: 480px; }
.bb-receipt-card { padding: var(--space-4, 16px); border-radius: var(--radius-card, 24px); border: 1px solid var(--line, #d9d6cf); background: var(--paper-raised, #ffffff); display: grid; gap: 6px; }
.bb-receipt-card.bb-receipt-now { border: 2px solid var(--blue, #4285f4); }
.bb-receipt-time { font-size: 12px; font-weight: 600; color: var(--pencil, #5f6368); letter-spacing: 0.02em; }
.bb-receipt-answer { font-size: 15px; line-height: 1.45; }
.bb-receipt-verdict { font-size: 13px; font-weight: 600; color: var(--blue-ink, #1967d2); }

/* Map node */
.bb-node { display: inline-grid; justify-items: center; gap: 6px; width: 104px; text-align: center; }
.bb-node-body {
  position: relative; width: 76px; height: 76px; border-radius: var(--radius-node, 16px); display: grid; place-items: center;
  background: var(--paper-raised, #ffffff); border: 2px solid var(--ink, #1f1f1f); box-shadow: var(--key-edge-neutral, 0 3px 0 #c9c5bc); cursor: pointer;
}
.bb-node-led { position: absolute; top: 7px; right: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--line, #d9d6cf); border: 1.5px solid var(--pencil, #5f6368); }
.bb-node-mastered .bb-node-led { background: var(--green, #34a853); border-color: var(--green-ink, #137333); box-shadow: 0 0 8px 2px rgba(52,168,83,0.55); }
.bb-node-flicker .bb-node-led { background: var(--green, #34a853); border-color: var(--green-ink, #137333); animation: bb-flicker 1.8s ease-in-out infinite; }
.bb-node-locked .bb-node-body { border: 2px dashed var(--pencil, #5f6368); box-shadow: none; background: transparent; cursor: default; }
.bb-node-available .bb-node-body { border-color: var(--ink, #1f1f1f); }
.bb-node-label { font-size: 13px; font-weight: 600; line-height: 1.25; }
.bb-node-locked .bb-node-label { color: var(--pencil, #5f6368); }
.bb-node-heat { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); padding: 2px 7px; border-radius: 999px; font: 600 11px/1.3 var(--font-mono, "Roboto Mono", monospace); background: var(--ink, #1f1f1f); color: var(--paper, #fbfaf7); white-space: nowrap; }
.bb-node-pin { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); }

/* Snackbar */
.bb-snack { display: inline-flex; align-items: center; gap: var(--space-3, 12px); padding: 12px 16px; border-radius: 16px; background: var(--ink, #1f1f1f); color: var(--paper, #fbfaf7); font-size: 14px; box-shadow: var(--lift, 0 8px 24px rgba(31,31,31,0.12)); max-width: 420px; }
.bb-snack-action { margin-left: auto; background: none; border: 0; color: var(--blue-tint, #e8f0fe); font: 600 14px/1 var(--font-body, "Noto Sans", sans-serif); cursor: pointer; padding: 6px; }
.bb-route-line { width: 22px; height: 6px; border-radius: 3px; background: var(--green, #34a853); flex: none; }

/* Source tag */
.bb-source { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line, #d9d6cf); background: var(--paper-raised, #ffffff); color: var(--ink, #1f1f1f); font: 600 12px/1.2 var(--font-body, "Noto Sans", sans-serif); cursor: pointer; }
.bb-source .bb-icon { font-size: 16px; color: var(--blue-ink, #1967d2); }
.bb-source-snippet { font: 400 14px/1.5 var(--font-hand, "Kalam", cursive); background: repeating-linear-gradient(var(--paper-raised, #ffffff) 0 23px, var(--line, #d9d6cf) 23px 24px); padding: 6px 10px; border-radius: 10px; }

/* Prediction canvas */
.bb-predict { display: grid; gap: var(--space-3, 12px); max-width: 480px; }
.bb-predict-screen { position: relative; border-radius: 18px; background: var(--scope-glass, #0e1116); overflow: hidden; aspect-ratio: 16 / 9; touch-action: none; cursor: crosshair; }
.bb-predict-screen canvas { width: 100%; height: 100%; display: block; }
.bb-predict-msg { font-size: 15px; min-height: 24px; }
.bb-predict-legend { display: flex; gap: var(--space-4, 16px); flex-wrap: wrap; font-size: 12px; color: var(--pencil, #5f6368); }
.bb-swatch { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

/* Lab stepper and spotlight */
.bb-stepper { display: grid; gap: var(--space-3, 12px); max-width: 520px; }
.bb-steps { display: flex; gap: 6px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.bb-step { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--pencil, #5f6368); border: 1.5px solid var(--line, #d9d6cf); }
.bb-step-done { color: var(--blue-ink, #1967d2); border-color: var(--blue, #4285f4); background: var(--blue-tint, #e8f0fe); }
.bb-step-now { color: var(--ink, #1f1f1f); border-color: var(--ink, #1f1f1f); background: var(--paper-raised, #ffffff); }
.bb-step-card { display: flex; gap: var(--space-3, 12px); align-items: flex-start; padding: var(--space-4, 16px); border-radius: var(--radius-card, 24px); background: var(--paper-raised, #ffffff); border: 1px solid var(--line, #d9d6cf); }
.bb-spot { position: relative; isolation: isolate; }
.bb-spot-dim { position: absolute; inset: 0; background: rgba(14,17,22,0.62); z-index: 1; pointer-events: none; border-radius: inherit; }
.bb-spot-target { position: relative; z-index: 2; box-shadow: 0 0 0 4px var(--blue, #4285f4), 0 0 0 9999px rgba(14,17,22,0); border-radius: 12px; }
.bb-spot-ring { position: absolute; inset: -8px; border-radius: 16px; border: 2px solid var(--blue, #4285f4); animation: bb-pulse 1.3s ease-in-out infinite; pointer-events: none; }

/* Fault card */
.bb-fault { display: grid; gap: var(--space-3, 12px); padding: var(--space-4, 16px); border-radius: var(--radius-card, 24px); background: var(--paper-raised, #ffffff); border: 2px solid var(--ink, #1f1f1f); max-width: 440px; }
.bb-fault-fixed { border-color: var(--blue, #4285f4); background: var(--blue-tint, #e8f0fe); }
.bb-fault-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2, 8px); flex-wrap: wrap; }
.bb-fault-type { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--ink, #1f1f1f); color: var(--paper, #fbfaf7); font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }

.flow .grp { font: 600 11px/1 var(--font-body); letter-spacing: 0.06em; color: var(--pencil); padding: 12px 10px 4px; }

.phone { width: 390px; height: 820px; border-radius: 48px; background: var(--frame); padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,0.18); flex: none; }
.screen-wrap { position: relative; width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: var(--paper); display: flex; flex-direction: column; }
.statusbar { flex: none; height: 34px; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font: 600 13px/1 var(--font-body); color: var(--ink); }
.mobilebar { display: none; }

@media (max-width: 760px) {
  .stage { padding: 0; gap: 0; display: block; }
  .panel { display: none; }
  .phone { width: 100%; height: 100%; min-height: 100vh; min-height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; background: var(--paper); }
  .screen-wrap { border-radius: 0; height: 100vh; height: 100dvh; }
  .statusbar { display: none; }
  .mobilebar { display: flex; flex: none; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 16px; font-size: 12px; color: var(--pencil); background: var(--paper-raised); border-bottom: 1px solid var(--line); }
  .mobilebar select { font: 500 12px var(--font-body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; max-width: 60vw; }
}

.scr { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scr-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 20px; display: grid; gap: 16px; align-content: start; }
.scr-foot { flex: none; padding: 12px 20px 18px; display: grid; gap: 8px; background: var(--paper); border-top: 1px solid var(--line); }
.scr-foot .bb-btn { width: 100%; }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 8px; min-height: 48px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn:hover { background: var(--line); }
.steps { display: flex; gap: 4px; flex: 1; }
.steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.steps span.on { background: var(--ink); }
.title { margin: 0; font: 700 26px/1.2 var(--font-display); text-wrap: balance; }
.title-or { margin: 0; font: 600 18px/1.6 var(--font-odia-display); color: var(--pencil); }
.sub { margin: 0; font-size: 15px; line-height: 1.5; color: var(--pencil); }
.card { padding: 16px; border-radius: var(--radius-card); background: var(--paper-raised); border: 1px solid var(--line); display: grid; gap: 10px; }
.card-ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.card-ink .sub { color: var(--paper); opacity: 0.8; }
.row { display: flex; gap: 12px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.choice { width: 100%; text-align: left; padding: 14px 16px; border-radius: 18px; border: 2px solid var(--line); background: var(--paper-raised); color: var(--ink); font: 400 15px/1.5 var(--font-body); cursor: pointer; display: grid; gap: 4px; }
.choice:hover { border-color: var(--pencil); }
.choice[aria-pressed="true"] { border-color: var(--blue-ink); background: var(--blue-tint); }
.choice[disabled] { opacity: 0.5; cursor: not-allowed; }
.choice .tag { font: 600 11px/1 var(--font-body); letter-spacing: 0.05em; color: var(--pencil); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper-raised); color: var(--ink); font: 600 14px/1 var(--font-body); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.chip[disabled] { opacity: 0.45; cursor: not-allowed; }
.note { font-size: 13px; color: var(--pencil); line-height: 1.45; }
.banner { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--blue-tint); color: var(--ink); font-size: 13px; }
.banner .bb-icon { color: var(--blue-ink); }
.kiki-line { display: flex; gap: 10px; align-items: flex-start; }
.kiki-line .bubble { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 4px 18px 18px 18px; background: var(--paper-raised); border: 1px solid var(--line); font-size: 15px; line-height: 1.5; }
.center { display: grid; justify-items: center; text-align: center; gap: 14px; }
.big-num { font: 700 30px/1 var(--font-display); }
.eyebrow { font: 600 11px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--pencil); }
.card-ink .eyebrow { color: var(--paper); opacity: 0.75; }

/* Chat mock */
.chat { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--paper); }
.chat-head { flex: none; display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: var(--paper-raised); border-bottom: 1px solid var(--line); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 700 14px/1 var(--font-body); background: var(--line); color: var(--ink); flex: none; }
.chat-body { flex: 1; overflow-y: auto; padding: 16px 12px; display: grid; gap: 10px; align-content: end; }
.msg { max-width: 84%; padding: 8px 12px; border-radius: 4px 16px 16px 16px; background: var(--paper-raised); border: 1px solid var(--line); font-size: 14px; line-height: 1.45; }
.msg .who { font: 700 12px/1.4 var(--font-body); color: var(--red-ink); }
.msg.me { justify-self: end; border-radius: 16px 4px 16px 16px; background: var(--green-tint); }
.preview { display: grid; gap: 8px; margin-top: 6px; padding: 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); text-align: left; cursor: pointer; width: 100%; color: var(--ink); font: inherit; }
.preview:hover { border-color: var(--blue-ink); }
.preview .url { font: 400 11px/1 var(--font-mono); color: var(--pencil); }
.chat-input { flex: none; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--paper-raised); color: var(--pencil); font-size: 14px; }

/* Route list */
.route { position: relative; display: grid; gap: 6px; }
.route::before { content: ""; position: absolute; left: 33px; top: 30px; bottom: 30px; width: 6px; border-radius: 3px; background: var(--blue); opacity: 0.85; }
.stop { position: relative; display: flex; gap: 14px; align-items: center; padding: 6px 4px; border-radius: 16px; }
.stop-node { position: relative; width: 60px; height: 60px; border-radius: var(--radius-node); background: var(--paper-raised); border: 2px solid var(--ink); box-shadow: var(--key-edge-neutral); display: grid; place-items: center; flex: none; z-index: 1; }
.stop-node .led { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--line); border: 1.5px solid var(--pencil); }
.stop-done .stop-node .led { background: var(--green); border-color: var(--green-ink); box-shadow: 0 0 8px 2px rgba(52,168,83,0.55); }
.stop-flicker .stop-node .led { background: var(--green); border-color: var(--green-ink); animation: bb-flicker 1.8s ease-in-out infinite; }
.stop-skip .stop-node { border-style: dashed; box-shadow: none; }
.stop-now { background: var(--blue-tint); }
.stop-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
.stop-meta { font-size: 12px; color: var(--pencil); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.heat { font: 600 11px/1.3 var(--font-mono); padding: 2px 7px; border-radius: 999px; background: var(--ink); color: var(--paper); }
.pin { position: absolute; left: -6px; top: -14px; z-index: 2; }

/* Bottom nav */
.nav { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--paper-raised); padding: 6px 8px 10px; }
.nav button { display: grid; justify-items: center; gap: 2px; padding: 6px; border: 0; background: transparent; color: var(--pencil); font: 600 12px/1.2 var(--font-body); cursor: pointer; border-radius: 12px; }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"] .bb-icon { font-variation-settings: "FILL" 1, "wght" 500, "opsz" 24; color: var(--blue-ink); }

/* Lesson */
.beat { display: grid; gap: 16px; }
.mcq { display: grid; gap: 8px; }
.mcq .choice.right { border-color: var(--blue); background: var(--blue-tint); }
.mcq .choice.notyet { border-style: dashed; border-color: var(--pencil); animation: shake 300ms ease 1; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.sticker-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.sticker-row .bb-sticker { width: 150px; height: 180px; flex: none; }
.collected-badge { position: absolute; top: 8px; right: 8px; z-index: 5; color: var(--red-ink); }
.charger { width: 100%; max-width: 280px; height: auto; justify-self: center; }
.toast-zone { position: absolute; left: 12px; right: 12px; bottom: 96px; display: grid; justify-items: center; z-index: 30; pointer-events: none; }
.toast-zone > * { pointer-events: auto; }
.counter { font: 700 40px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.strike { text-decoration: line-through; color: var(--pencil); font-size: 24px; }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 76px 1fr 54px; gap: 10px; align-items: center; font-size: 13px; }
.bar-track { height: 10px; border-radius: 10px; background: var(--line); overflow: hidden; }
.bar-track > span { display: block; height: 100%; border-radius: 10px; }
.mile { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.mile .bb-icon { color: var(--blue-ink); }
.share { display: grid; gap: 6px; padding: 16px; border-radius: 20px; background: var(--ink); color: var(--paper); }
.share b { font: 700 20px/1.2 var(--font-display); }
@media (prefers-reduced-motion: reduce) { .mcq .choice.notyet { animation: none; } }
</style>
