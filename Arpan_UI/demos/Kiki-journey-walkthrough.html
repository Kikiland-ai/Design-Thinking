<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>[hidden]{display:none!important}</style>
<title>Kiki Journey Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;600&family=Roboto+Mono:wght@400;500&family=Baloo+2:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<style>
/* Layout: review console. Left rail = the 12 journey stages, centre = the live device, right = spec inspector. */
:root{
  --bg:#f4f3ef; --panel:#ffffff; --panel-2:#faf9f6; --fg:#1f1f1f; --muted:#5f6368; --line:#dedbd3; --dot:#e3e1dc;
  --accent:#1967d2; --accent-tint:#e8f0fe;
  --sev-high:#b3261e; --sev-high-bg:#fbe9e7; --sev-med:#8a5300; --sev-med-bg:#fef3d6; --sev-low:#3c4043; --sev-low-bg:#eceae4;
  --f-ui:"Noto Sans",system-ui,sans-serif; --f-disp:"Baloo 2","Noto Sans",system-ui,sans-serif; --f-mono:"Roboto Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --panel:#1b1e23; --panel-2:#20242a; --fg:#e8eaed; --muted:#a8adb4; --line:#343943; --dot:#262a31;
  --accent:#8ab4f8; --accent-tint:#1b2a44;
  --sev-high:#f2b8b5; --sev-high-bg:#3a1e1c; --sev-med:#fdd663; --sev-med-bg:#3a3220; --sev-low:#c9ccd1; --sev-low-bg:#2a2e35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1e23; --panel-2:#20242a; --fg:#e8eaed; --muted:#a8adb4; --line:#343943; --dot:#262a31;
  --accent:#8ab4f8; --accent-tint:#1b2a44;
  --sev-high:#f2b8b5; --sev-high-bg:#3a1e1c; --sev-med:#fdd663; --sev-med-bg:#3a3220; --sev-low:#c9ccd1; --sev-low-bg:#2a2e35; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-ui);margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:"liga";vertical-align:middle;overflow:hidden;width:1em}
.wrap{padding-inline:16px;padding-block:14px 32px;max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ---------- top bar ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{flex:none}
.brand h1{font:700 24px/1.1 var(--f-disp);margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.top .sp{flex:1}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;user-select:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px}
.tog input{accent-color:var(--accent);margin:0}

/* ---------- main grid ---------- */
.main{display:grid;grid-template-columns:232px minmax(0,1fr) 380px;gap:14px;align-items:start}
.rail,.insp{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding:8px}
.rail h2,.insp h2{font:600 11px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 8px 8px}
.stg{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:7px 8px;cursor:pointer}
.stg:hover{background:var(--panel-2)}
.stg .n{font:500 11px var(--f-mono);color:var(--muted);margin-right:6px}
.stg .t{font-weight:600;font-size:13px}
.stg .fl{float:right;font:500 10.5px var(--f-mono);padding:1px 6px;border-radius:999px;background:var(--sev-high-bg);color:var(--sev-high)}
.stg.on{background:var(--accent-tint)}
.scr{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 22px}
.scr button{border:0;background:none;text-align:left;font-size:12.5px;color:var(--muted);padding:3px 8px;border-radius:7px;cursor:pointer;display:flex;gap:6px;align-items:center}
.scr button:hover{color:var(--fg)}
.scr button.on{color:var(--fg);font-weight:600;background:var(--panel-2)}
.scr .dv{font-size:15px;width:16px;opacity:.7}

.stage{min-width:0;display:flex;flex-direction:column;gap:10px}
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.stagebar .crumb{font:500 12px var(--f-mono);color:var(--muted)}
.stagebar h3{margin:0;font:700 20px/1.2 var(--f-disp);flex:1 1 220px;text-wrap:balance}
.navb{display:flex;gap:6px}
.navb button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:4px;align-items:center;font-size:12.5px}
.navb button:disabled{opacity:.4;cursor:default}
.purpose{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.holder{position:relative;width:100%;background:radial-gradient(var(--dot) 1px,transparent 1.2px) 0 0/16px 16px;border-radius:16px;border:1px solid var(--line);padding:18px 0;display:flex;justify-content:center;overflow:hidden}
.scaler{transform-origin:top center;flex:none}
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.demo .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;gap:4px;align-items:center}
.demo button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.demo button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}

/* ---------- inspector ---------- */
.insp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden}
.itabs{display:flex;border-bottom:1px solid var(--line);padding:6px 6px 0;gap:2px;flex:none}
.itabs button{border:0;background:none;padding:8px 10px;cursor:pointer;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
.itabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.ibody{overflow:auto;padding:4px 14px 18px;min-height:0}
.src{font:500 11.5px var(--f-mono);color:var(--muted);margin:10px 0 4px}
.spec{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.spec li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:8px 6px;border-radius:10px;cursor:default}
.spec li:hover,.spec li.hl{background:var(--accent-tint)}
.pinn{width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);font:600 11px/22px var(--f-mono);text-align:center}
.spec b{font-size:13px}
.spec .k{font:500 10.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
.spec p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.spec p strong{color:var(--fg);font-weight:600}
.flag{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--panel-2)}
.flag .h{display:flex;gap:8px;align-items:flex-start}
.flag .id{font:600 11px var(--f-mono);flex:none;padding:2px 7px;border-radius:999px}
.flag.high .id{background:var(--sev-high-bg);color:var(--sev-high)}
.flag.med .id{background:var(--sev-med-bg);color:var(--sev-med)}
.flag.low .id{background:var(--sev-low-bg);color:var(--sev-low)}
.flag.done{opacity:.8}.flag.done .id{background:var(--accent-tint);color:var(--accent)}
.flag .tt{font-weight:600;font-size:13px;line-height:1.35}
.flag .ty{font:500 10.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-top:2px}
.flag p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.flag p em{font-style:normal;color:var(--fg);font-weight:600}
.flag .go{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.flag .go button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 8px;font-size:11.5px;cursor:pointer}
.fgroup{font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px}
.empty{color:var(--muted);font-size:12.5px;margin:6px 0}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.moves figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fbfaf7}
.moves figcaption{font-size:11.5px;padding:6px 8px;background:var(--panel);color:var(--muted);border-top:1px solid var(--line)}
.moves figcaption b{color:var(--fg);display:block;font-size:12px}
.story{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fbfaf7;margin-top:8px}
.legend{font-size:12.5px;color:var(--muted)}
.legend p{margin:6px 0}

/* pin overlay */
.pinlayer{position:absolute;inset:0;pointer-events:none;z-index:50}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#1f1f1f;color:#fff;font:700 11px/20px "Roboto Mono",monospace;text-align:center;border:1px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer}
.pin.hl{background:#d93025}
.app .hlx{outline:3px solid #d93025 !important;outline-offset:2px}

@media (max-width:1240px){.main{grid-template-columns:200px minmax(0,1fr)}.insp{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;display:flex;overflow-x:auto;gap:4px;padding:6px}
  .rail h2,.rail .scr{display:none}
  .stg{flex:none;width:auto;white-space:nowrap}
  .stg .fl{float:none;margin-left:6px}
}

/* =====================================================================
   THE APP MOCK. A deliberately single (light) look: it is a picture of the product UI,
   so every colour is set explicitly inside .app and does not follow the page theme.
   ===================================================================== */
.app{
  --ink:#1f1f1f; --pencil:#5f6368; --line:#dadce0; --bgc:#ffffff; --soft:#f8f9fa;
  --blue:#4285f4; --blue-ink:#1967d2; --blue-tint:#e8f0fe;
  --red:#ea4335; --red-ink:#c5221f; --red-tint:#fce8e6; --red-strong:#c5221f;
  --yellow:#fbbc05; --yellow-ink:#9a5500; --yellow-tint:#fef7e0;
  --green:#34a853; --green-ink:#137333; --green-tint:#e6f4ea;
  /* dimension aliases: Journey doc mapping (green = concept, blue = practical) */
  --concept:var(--green); --concept-ink:var(--green-ink); --concept-tint:var(--green-tint);
  --practical:var(--blue); --practical-ink:var(--blue-ink); --practical-tint:var(--blue-tint);
  --scope-glass:#0e1116; --scope-grid:#23303a; --scope-trace:#5be38a; --scope-text:#c9d6df;
  --f-app:"Google Sans","Noto Sans",system-ui,sans-serif; --f-odia:"Noto Sans Oriya","Noto Sans",sans-serif;
  font:15px/1.45 var(--f-app); color:var(--ink); background:var(--bgc); color-scheme:light;
  position:relative; overflow:hidden;
}
.map-ds .app{--concept:var(--blue); --concept-ink:var(--blue-ink); --concept-tint:var(--blue-tint); --practical:var(--green); --practical-ink:var(--green-ink); --practical-tint:var(--green-tint)}
.app *{box-sizing:border-box}
.app button{font-family:var(--f-app);cursor:pointer}
.od{font-family:var(--f-odia);font-size:1.08em;line-height:1.66}
.app .en-sub{font-size:13px;color:var(--pencil)}

/* phone */
.phone{width:410px;height:836px;border-radius:46px;background:#202124;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.phone>.app{width:390px;height:816px;border-radius:37px;display:flex;flex-direction:column}
.sb{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font:500 13px var(--f-app)}
.sb .ms{font-size:16px}
.pbody{flex:1;overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px;position:relative}
.ab{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 16px;flex:none;min-height:52px}
.ab-t{flex:1;font:600 17px var(--f-app);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--soft)}
.labbtn{border:1px solid var(--line);background:var(--bgc);border-radius:999px;display:inline-flex;align-items:center;gap:4px;padding:5px 10px 5px 8px;font-size:12.5px;font-weight:500;color:var(--ink);position:relative}
.labbtn .ms{font-size:18px;color:var(--practical-ink)}
.labbtn .live{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--practical);border:2px solid #fff}
.navbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:6px 4px 14px;background:#fff}
.navbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--pencil);padding:4px 0}
.navbar button .ms{font-size:22px}
.navbar button.on{color:var(--ink);font-weight:600}
.navbar button.on .ms{font-variation-settings:"FILL" 1;background:var(--soft);border-radius:999px;width:52px;padding:3px 0;text-align:center}

/* buttons: pill on a key edge (design system) */
.b{border:0;border-radius:999px;min-height:48px;padding:0 20px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s, box-shadow .12s}
.b:active{transform:translateY(2px);box-shadow:none !important}
.b-p{background:var(--blue-ink);color:#fff;box-shadow:0 3px 0 #0f4fa8}
.b-s{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 #c9c5bc}
.b-t{background:none;color:var(--blue-ink);min-height:40px;padding:0 10px}
.b:disabled{background:#e8eaed;color:#80868b;box-shadow:none;cursor:not-allowed}
.b-w{width:100%}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:#fff}
.card.soft{background:var(--soft)}
.h1{font:700 26px/1.2 var(--f-app);margin:0}
.h2{font:700 20px/1.25 var(--f-app);margin:0}
.h3{font:600 15px/1.3 var(--f-app);margin:0}
.lab-s{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--pencil)}
.mut{color:var(--pencil);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;background:#fff;min-height:36px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--pencil)}
.tag.prop{border:1px dashed #9aa0a6;background:#fff}
.field{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;background:#fff;min-height:48px}
.field .ph{color:var(--pencil);flex:1}
.field .val{flex:1}
.term{display:inline-flex;align-items:center;border-radius:8px;padding:0 6px;background:var(--red-tint);color:var(--red-ink);font-weight:600;font-family:var(--f-app);font-size:.92em;line-height:1.6;border:0;cursor:pointer}
.status{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:#303134;color:#fff;border-radius:12px;padding:12px 14px;font-size:13.5px;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sheet-bg{position:absolute;inset:0;background:rgba(32,33,36,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:10px 18px 22px;display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;text-align:left;width:100%;min-height:54px;font-size:15px}
.opt.on{border:2px solid var(--ink);padding:11px 13px}
.opt .ms{color:var(--pencil)}
.opt.ok{border:2px solid var(--concept);background:var(--concept-tint)}
.opt.no{border:2px dashed var(--pencil)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list>div{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.list>div:first-child{border-top:0}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.d{background:var(--ink)}
.prog i.c{background:var(--pencil)}
.kicap{background:#202124;color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.kicap .od{color:#fff}
.kicap .en-sub{color:#bdc1c6}
.ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line);color:#fff;font-size:14px}
.ck.y{background:var(--ink);border-color:var(--ink)}
.ck.now{border-color:var(--ink);border-style:solid}
.ck.now::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.ck .ms{font-size:16px}

/* welcome logo */
.logo{display:flex;align-items:flex-end;justify-content:center;font:700 64px/1 var(--f-app);letter-spacing:.02em;height:76px}
.ki-roll{display:inline-block;height:76px;overflow:hidden;vertical-align:bottom}
.ki-roll span{display:block;height:76px;line-height:76px;text-align:center}
.ki-roll .od2{font-family:var(--f-odia),"Noto Sans",sans-serif;font-weight:600}
.ki-roll.run .strip{animation:roll 2.4s cubic-bezier(.6,.0,.2,1) forwards}
.ki-roll.end .strip{transform:translateY(-456px)}
@keyframes roll{0%{transform:translateY(0)}100%{transform:translateY(-456px)}}
@media (prefers-reduced-motion:reduce){.ki-roll.run .strip{animation:none;transform:translateY(-456px)}}

/* laptop */
.laptop{width:1220px}
.lid{background:#202124;border-radius:18px 18px 0 0;padding:12px 12px 0}
.lscreen{width:1196px;height:740px;border-radius:6px 6px 0 0;background:#dfe1e5;position:relative;overflow:hidden}
.lbase{height:20px;background:linear-gradient(#c4c7cc,#9aa0a6);border-radius:0 0 18px 18px;margin:0 -20px}
.lscreen>.app{width:100%;height:100%;background:#dfe1e5}
.win{position:absolute;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.18);display:flex;flex-direction:column}
.wbar{height:38px;flex:none;background:#f1f3f4;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12.5px;color:var(--pencil);border-bottom:1px solid var(--line)}
.wbar .url{flex:1;background:#fff;border-radius:999px;padding:5px 12px;color:var(--ink);font-size:12.5px;display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.wbar .url .ms{font-size:15px;color:var(--pencil)}
.wdots{display:flex;gap:6px}.wdots i{width:10px;height:10px;border-radius:50%;background:#dadce0}

/* simulink mock */
.sim{position:relative;flex:1;background:#fff;overflow:hidden;font-family:"Noto Sans",Arial,sans-serif}
.sim-tb{height:44px;border-bottom:1px solid #d0d4d9;background:#f5f6f7;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:12px;color:#333}
.sim-tb .run{display:flex;flex-direction:column;align-items:center;font-size:10.5px;gap:0;border:0;background:none;padding:2px 8px;border-radius:6px}
.sim-tb .run .ms{color:#1a7f37;font-size:24px;font-variation-settings:"FILL" 1}
.sim-tb .fld{border:1px solid #c8ccd1;background:#fff;padding:2px 8px;border-radius:4px;font-family:"Roboto Mono",monospace;font-size:11.5px}
.lib{position:absolute;left:0;top:44px;bottom:0;width:196px;border-right:1px solid #d0d4d9;background:#fafbfc;font-size:12px}
.lib .gh{padding:7px 10px 3px;font-weight:700;color:#444;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.lib .it{margin:0 8px;padding:4px 8px;border-radius:5px;display:flex;align-items:center;gap:7px;height:26px}
.lib .it i{width:16px;height:12px;border:1.5px solid #555;border-radius:2px;flex:none}
.canvas{position:absolute;left:196px;top:44px;right:0;bottom:0;background:#fff radial-gradient(#e5e8eb 1px,transparent 1.2px) 0 0/14px 14px}
.blk{position:absolute;border:1.5px solid #333;border-radius:3px;background:#fff;display:grid;place-items:center;font-size:11px;text-align:center;color:#222}
.blk small{position:absolute;bottom:-18px;left:-20px;right:-20px;text-align:center;font-size:10.5px;color:#444;white-space:nowrap}
.blk.ghost{border-style:dashed;border-color:#9aa0a6;color:#9aa0a6;background:transparent}
.wire{position:absolute;inset:0;pointer-events:none}
/* Kiki pointer layer */
.kl{position:absolute;inset:0;pointer-events:none;z-index:30}
.kp{position:absolute;width:0;height:0;transition:left .6s cubic-bezier(.3,.7,.2,1),top .6s cubic-bezier(.3,.7,.2,1)}
.kp svg{position:absolute;left:-14px;top:-12px;overflow:visible}
.kcall{position:absolute;left:30px;top:30px;background:#202124;color:#fff;border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.35;width:max-content;max-width:230px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.kcall .od{color:#fff;font-size:12.5px;display:block}
.halo{position:absolute;border-radius:9px;border:2.2px solid var(--practical);background:color-mix(in srgb,var(--practical-tint) 28%,transparent);transition:all .5s}
.halo::after{content:"";position:absolute;inset:-6px;border-radius:12px;border:1.6px solid var(--practical);opacity:.5;animation:hal 1.8s infinite}
@keyframes hal{0%,100%{inset:-3px;opacity:.5}50%{inset:-9px;opacity:0}}
.bdg{position:absolute;width:21px;height:21px;margin:-10.5px 0 0 -10.5px;border-radius:50%;font:700 11.5px/17px "Noto Sans",sans-serif;text-align:center;border:2px solid #fff}
.bdg.now{background:var(--practical-ink);color:#fff}
.bdg.next{background:#fff;color:var(--practical-ink);border:1.6px dashed var(--practical-ink);line-height:17px}
.bdg.done{background:var(--practical);color:#fff}
.ghostp{position:absolute;left:150px;top:182px;opacity:.55;animation:ghost 2.6s ease-in-out infinite}
@keyframes ghost{0%,12%{transform:translate(0,0)}70%,100%{transform:translate(300px,24px)}}
@media (prefers-reduced-motion:reduce){.ghostp{animation:none;transform:translate(300px,24px)}.halo::after{animation:none}}
.scope{background:var(--scope-glass);border-radius:8px;padding:8px;color:var(--scope-text);font:11px "Roboto Mono",monospace}
.tracker-step{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13px;border-top:1px solid #f1f3f4}
.tracker-step:first-child{border-top:0}
.st-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;border:1.5px solid}
.st-active{border-color:var(--practical-ink);color:var(--practical-ink);background:var(--practical-tint)}
.st-paused{border-color:var(--pencil);color:var(--pencil);background:#fff}
.st-off{border-color:var(--pencil);color:var(--pencil);border-style:dashed;background:#fff}
.st-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
</style>

/* Kiki pointer, drawn from kiki-pointer.svg: tip at (0,0), four-dot trail behind the tail */
function kpSVG({ghost=false,happy=false,gx=1,gy=0}={}){
  const e=[[16.8,25],[23.4,25]].map(([x,y])=>happy?`<path d="M${x-2.6} ${y+.8} Q${x} ${y-2.6} ${x+2.6} ${y+.8}" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>`:`<circle cx="${x}" cy="${y}" r="2.9" fill="#fff"/><circle cx="${x+gx*1.1}" cy="${y+gy*1.1}" r="1.35" fill="#1f1f1f"/>`).join('');
  const trail=ghost?'':`<circle cx="36" cy="62" r="3.2" fill="#4285f4"/><circle cx="42" cy="70" r="3.2" fill="#ea4335"/><circle cx="48" cy="77" r="3.2" fill="#fbbc05"/><circle cx="55" cy="84" r="3.2" fill="#34a853"/>`;
  return `<svg width="70" height="100" viewBox="-14 -12 70 100" aria-hidden="true">${trail}<g transform="translate(-12 -8)"><path d="M12 8 L12 46 L21.5 37.5 L28.5 53 L35 50 L28 35 L40 35 Z" fill="${ghost?'#5f6368':'#1f1f1f'}" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"/>${e}</g></svg>`;
}

/* LanguageDial: five notches, Odia to English; only the student moves it */
const DIALN=['Odia with English terms','Mostly Odia','Half and half','Mostly English','English with Odia on tap'];
function dialHTML(pin,compact){return `<div ${pin?`data-pin="${pin}"`:''} style="display:flex;flex-direction:column;gap:4px">
 <div class="row" style="gap:8px"><span class="od" style="font-size:12.5px">ଓଡ଼ିଆ</span><div style="flex:1;position:relative;height:28px;display:flex;align-items:center;justify-content:space-between">
 <i style="position:absolute;left:8px;right:8px;height:4px;border-radius:2px;background:var(--line)"></i>
 ${[1,2,3,4,5].map(n=>`<button data-act="dial:${n}" aria-label="Notch ${n}: ${DIALN[n-1]}" style="position:relative;width:${S.dial===n?24:12}px;height:${S.dial===n?24:12}px;border-radius:50%;border:${S.dial===n?'0':'2px solid var(--pencil)'};background:${S.dial===n?'var(--ink)':'#fff'};padding:0"></button>`).join('')}</div><span style="font-size:12.5px">English</span></div>
 ${compact?'':`<span class="mut" style="text-align:center">${S.dial} · ${DIALN[S.dial-1]}</span>`}</div>`}
/* waveform helpers */
function wave(fn,w,h,n=240){let d='';for(let i=0;i<=n;i++){const x=i/n*w,y=h/2-fn(i/n)*h*.42;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}return d}
const msg=t=>Math.sin(2*Math.PI*2*t);
function scopeSVG(mode,w=360,h=150){
  const grid=[...Array(9)].map((_,i)=>`<line x1="${i*w/8}" y1="0" x2="${i*w/8}" y2="${h}" stroke="var(--scope-grid)"/>`).join('')+[...Array(5)].map((_,i)=>`<line x1="0" y1="${i*h/4}" x2="${w}" y2="${i*h/4}" stroke="var(--scope-grid)"/>`).join('');
  const rec=mode==='ok'?t=>.9*Math.sin(2*Math.PI*2*t-.25):mode==='mod'?t=>msg(t)*Math.sin(2*Math.PI*24*t):t=>.06*Math.sin(2*Math.PI*48*t)+.03*Math.sin(2*Math.PI*2*t);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${grid}<path d="${wave(msg,w,h)}" fill="none" stroke="#8ab4f8" stroke-width="1.6" opacity=".85"/><path d="${wave(rec,w,h,600)}" fill="none" stroke="var(--scope-trace)" stroke-width="2"/></svg>`;
}
/* four-part ring, clockwise from the top: concept, words, english, practical */
function ring(vals,size=150){
  const c=size/2,r=size/2-12,cols=['var(--concept)','var(--red)','var(--yellow)','var(--practical)'];
  const pt=a=>[c+r*Math.sin(a),c-r*Math.cos(a)];
  const arc=(a0,a1)=>{const[x0,y0]=pt(a0),[x1,y1]=pt(a1);return`M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`};
  let s='';vals.forEach((v,i)=>{const a0=i*Math.PI/2+.07,a1=(i+1)*Math.PI/2-.07;s+=`<path d="${arc(a0,a1)}" stroke="#e8eaed" stroke-width="14" fill="none" stroke-linecap="round"/>`;if(v>0)s+=`<path d="${arc(a0,a0+(a1-a0)*v)}" stroke="${cols[i]}" stroke-width="14" fill="none" stroke-linecap="round"/>`});
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Progress ring">${s}<image href="assets/kiki-dots.svg" x="${c-22}" y="${c-22}" width="44" height="44"/></svg>`;
}

  const pin=e.target.closest('.pin');if(pin){S.tab='s';renderInspector();const li=$(`#ibody [data-spec="${pin.dataset.pinref}"]`);if(li){li.classList.add('hl');li.scrollIntoView({block:'nearest',behavior:'smooth'});setTimeout(()=>li.classList.remove('hl'),1600)}return}
  const el=e.target.closest('[data-act],[data-go]');if(!el||el.disabled)return;
  if(el.closest('#scaler')||el.closest('#demo')){
    if(el.dataset.act)act(el.dataset.act);
    if(el.dataset.go)go(el.dataset.go);
  }
});
document.addEventListener('mouseover',e=>{const li=e.target.closest('#ibody [data-spec]');document.querySelectorAll('.hlx').forEach(x=>x.classList.remove('hlx'));document.querySelectorAll('.pin.hl').forEach(x=>x.classList.remove('hl'));
  if(li){const n=li.dataset.spec;document.querySelectorAll(`#scaler [data-pin="${n}"]`).forEach(x=>x.classList.add('hlx'));document.querySelectorAll(`.pin[data-pinref="${n}"]`).forEach(x=>x.classList.add('hl'))}});
$('#prev').onclick=()=>{if(cur>0){cur--;S.toast=null;render(true)}};
$('#next').onclick=()=>{if(cur<SCREENS.length-1){cur++;S.toast=null;render(true)}};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});
$('#pinsToggle').onchange=e=>{pinsOn=e.target.checked;placePins()};
const setMap=m=>{document.documentElement.classList.toggle('map-ds',m==='ds');$('#mapDoc').setAttribute('aria-pressed',m==='doc');$('#mapDs').setAttribute('aria-pressed',m==='ds');try{localStorage.setItem('kj-map',m)}catch(e){}};
$('#mapDoc').onclick=()=>setMap('doc');$('#mapDs').onclick=()=>setMap('ds');
try{setMap(localStorage.getItem('kj-map')||'doc')}catch(e){setMap('doc')}
['S','F','K'].forEach(k=>$('#tab'+k).onclick=()=>{S.tab=k.toLowerCase();renderInspector()});
new ResizeObserver(()=>fit()).observe($('#holder'));
let pinT;$('#scaler').addEventListener('load',()=>{clearTimeout(pinT);pinT=setTimeout(placePins,60)},true);
document.fonts&&document.fonts.ready.then(()=>placePins());
render();
</script>

</html>
